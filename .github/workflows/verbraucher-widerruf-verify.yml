name: Verbraucher Widerruf Verify

on:
  push:
    branches:
      - legal/verbraucher-widerruf

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Verbraucherinfos prüfen
        run: python scripts/validate_verbraucher_widerruf.py
      - name: Bestehende Rechtliches-Prüfung
        run: python scripts/validate_rechtliches_2026.py
      - name: Sitemap als XML prüfen
        run: python -c "import xml.etree.ElementTree as ET; ET.parse('sitemap.xml'); print('sitemap.xml: OK')"
      - name: Deploy-Paket bauen
        shell: pwsh
        run: ./build_deploy.ps1
      - name: Verbraucherinfos im Deploy prüfen
        run: |
          test -f _deploy/kontakt/verbraucherinformationen-widerruf.html
          test -f _deploy/kontakt/ablauf-anfrage.html
          test -f _deploy/kontakt/kontakt.html
          grep -q "Verbraucherinformationen" _deploy/kontakt/verbraucherinformationen-widerruf.html
