name: Rechtliches 2026 Verify

on:
  push:
    branches:
      - legal/rechtliches-2026

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Rechtliches 2026 prüfen
        run: python scripts/validate_rechtliches_2026.py
      - name: Deploy-Paket bauen
        shell: pwsh
        run: ./build_deploy.ps1
      - name: Rechtliche Seiten im Deploy prüfen
        shell: pwsh
        run: |
          $required = @(
            '_deploy/datenschutz.html',
            '_deploy/kontakt/impressum.html',
            '_deploy/kontakt/kontakt.html'
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Deploy-Datei fehlt: $path"
            }
          }
