name: Global Music Player Verify

on:
  push:
    branches:
      - feature/global-music-player

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Globalen Musikplayer prüfen
        run: python scripts/validate_global_music_player.py
      - name: Bestehenden KI-Musik-Bereich prüfen
        run: python scripts/validate_ki_music_area.py
      - name: JavaScript-Syntax prüfen
        run: |
          node --check assets/js/ws-layout.js
          node --check assets/js/ki-music-player.js
          node --check assets/js/ws-global-music-player.js
      - name: Deploy-Paket bauen
        shell: pwsh
        run: ./build_deploy.ps1
      - name: Globale Player-Dateien im Deploy prüfen
        shell: pwsh
        run: |
          $required = @(
            '_deploy/assets/js/ws-global-music-player.js',
            '_deploy/assets/css/ws-global-music-player.css',
            '_deploy/assets/js/ws-layout.js',
            '_deploy/assets/js/ki-music-player.js'
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Deploy-Datei fehlt: $path"
            }
          }
